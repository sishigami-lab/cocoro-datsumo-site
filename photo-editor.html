<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
  <title>写真変更 | cocoRo脱毛</title>
  <style>
    :root {
      --gold: #ab8443;
      --gold-dark: #86652d;
      --text: #2f2a25;
      --muted: #6e655d;
      --line: #e7ded1;
      --soft: #fbf7f1;
      --white: #fff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 18px;
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
      background: var(--soft);
    }

    main {
      max-width: 820px;
      margin: 0 auto;
    }

    h1 {
      margin: 16px 0 8px;
      font-size: clamp(28px, 8vw, 44px);
      letter-spacing: 0;
    }

    p,
    li {
      color: var(--muted);
      font-size: 16px;
      line-height: 1.75;
    }

    .panel {
      display: grid;
      gap: 18px;
      margin-top: 24px;
      padding: 20px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--white);
      box-shadow: 0 16px 48px rgba(77, 61, 40, 0.08);
    }

    label {
      display: grid;
      gap: 7px;
      color: var(--muted);
      font-size: 14px;
      font-weight: 700;
    }

    select,
    input {
      width: 100%;
      min-height: 46px;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 7px;
      color: var(--text);
      font-size: 16px;
      background: #fff;
    }

    .preview {
      display: grid;
      gap: 10px;
    }

    .preview-box {
      display: grid;
      place-items: center;
      min-height: 260px;
      overflow: hidden;
      border: 1px dashed var(--gold);
      border-radius: 10px;
      background: #fbf7f1;
    }

    .preview-box img {
      width: 100%;
      max-height: 520px;
      object-fit: contain;
      display: block;
    }

    .filename {
      padding: 12px 14px;
      border-radius: 8px;
      color: var(--gold-dark);
      font-weight: 700;
      background: #f5ecdd;
      word-break: break-all;
    }

    .button-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    button,
    a.button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      padding: 10px 16px;
      border: 1px solid var(--gold);
      border-radius: 999px;
      color: var(--gold-dark);
      font-size: 15px;
      font-weight: 700;
      text-decoration: none;
      background: #fff;
      cursor: pointer;
    }

    .primary {
      color: #fff;
      background: linear-gradient(135deg, #c9a35c, #8c6427);
    }

    .note {
      margin-top: 16px;
      padding: 14px 16px;
      border-left: 4px solid var(--gold);
      background: #fff;
      color: var(--muted);
      font-size: 14px;
    }
  </style>
</head>
<body>
  <main>
    <h1>写真変更</h1>
    <p>変えたい場所を選んで、写真を選ぶだけです。最後に「この名前で保存」を押してください。</p>

    <section class="panel" aria-label="写真変更フォーム">
      <label>
        変えたい写真
        <select id="photoSlot">
          <option value="campaign-open.jpg">オープンキャンペーン画像</option>
          <option value="before-after-hige-01.png">ヒゲ1</option>
          <option value="before-after-hige-02.png">ヒゲ2</option>
          <option value="before-after-hige-03.png">ヒゲ3</option>
          <option value="before-after-unaji-01.png">うなじ</option>
          <option value="before-after-waki-01.png">ワキ1</option>
          <option value="before-after-waki-02.png">ワキ2</option>
          <option value="cocoro-sign-logo.jpg">看板ロゴ</option>
          <option value="property-reference.jpg">物件・店内参考</option>
          <option value="counseling-scene.jpg">カウンセリング写真</option>
        </select>
      </label>

      <label>
        新しい写真を選ぶ
        <input id="photoInput" type="file" accept="image/*" />
      </label>

      <div class="preview">
        <div class="filename" id="fileName">保存名：campaign-open.jpg</div>
        <div class="preview-box" id="previewBox">
          <p>ここに選んだ写真が表示されます。</p>
        </div>
      </div>

      <div class="button-row">
        <button type="button" id="downloadButton" class="primary" disabled>この名前で保存</button>
        <a class="button" id="currentPhotoLink" href="campaign-open.jpg" target="_blank" rel="noopener">今の写真を見る</a>
        <a class="button" href="settings.html">設定画面に戻る</a>
      </div>
    </section>

    <p class="note">保存した写真をホームページの同じフォルダに上書きすると、写真が差し替わります。ビフォーアフターは正方形に近い写真、カウンセリング写真は横長の写真がおすすめです。</p>
  </main>

  <script>
    const photoSlot = document.getElementById("photoSlot");
    const photoInput = document.getElementById("photoInput");
    const fileName = document.getElementById("fileName");
    const previewBox = document.getElementById("previewBox");
    const downloadButton = document.getElementById("downloadButton");
    const currentPhotoLink = document.getElementById("currentPhotoLink");
    let selectedFileUrl = "";

    const updateSlot = () => {
      const name = photoSlot.value;
      fileName.textContent = `保存名：${name}`;
      currentPhotoLink.href = name;
    };

    photoSlot.addEventListener("change", updateSlot);

    photoInput.addEventListener("change", () => {
      const file = photoInput.files[0];
      if (!file) return;

      if (selectedFileUrl) URL.revokeObjectURL(selectedFileUrl);
      selectedFileUrl = URL.createObjectURL(file);
      previewBox.innerHTML = `<img src="${selectedFileUrl}" alt="選択した写真のプレビュー" />`;
      downloadButton.disabled = false;
    });

    downloadButton.addEventListener("click", () => {
      const file = photoInput.files[0];
      if (!file) return;

      const link = document.createElement("a");
      link.href = selectedFileUrl;
      link.download = photoSlot.value;
      link.click();
    });

    updateSlot();
  </script>
</body>
</html>
