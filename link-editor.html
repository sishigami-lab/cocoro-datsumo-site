<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
  <title>リンク変更 | cocoRo脱毛</title>
  <style>
    :root {
      --gold: #ab8443;
      --gold-dark: #86652d;
      --text: #2f2a25;
      --muted: #6e655d;
      --line: #e7ded1;
      --soft: #fbf7f1;
      --white: #fff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 18px;
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
      background: var(--soft);
    }

    main {
      max-width: 760px;
      margin: 0 auto;
    }

    h1 {
      margin: 16px 0 8px;
      font-size: clamp(28px, 8vw, 44px);
      letter-spacing: 0;
    }

    p {
      color: var(--muted);
      font-size: 16px;
      line-height: 1.75;
    }

    .panel {
      display: grid;
      gap: 16px;
      margin-top: 24px;
      padding: 20px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--white);
      box-shadow: 0 16px 48px rgba(77, 61, 40, 0.08);
    }

    label {
      display: grid;
      gap: 7px;
      color: var(--muted);
      font-size: 14px;
      font-weight: 700;
    }

    input {
      width: 100%;
      min-height: 46px;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 7px;
      color: var(--text);
      font-size: 16px;
      background: #fff;
    }

    .button-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 8px;
    }

    button,
    a.button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      padding: 10px 16px;
      border: 1px solid var(--gold);
      border-radius: 999px;
      color: var(--gold-dark);
      font-size: 15px;
      font-weight: 700;
      text-decoration: none;
      background: #fff;
      cursor: pointer;
    }

    .primary {
      color: #fff;
      background: linear-gradient(135deg, #c9a35c, #8c6427);
    }

    .note {
      margin-top: 16px;
      padding: 14px 16px;
      border-left: 4px solid var(--gold);
      background: #fff;
      color: var(--muted);
      font-size: 14px;
    }
  </style>
</head>
<body>
  <main>
    <h1>リンク変更</h1>
    <p>LINE・Instagram・Googleマップ・電話番号を入力するだけです。最後に保存用ファイルを作ってください。</p>

    <section class="panel" aria-label="リンク変更フォーム">
      <label>
        LINE予約URL
        <input id="lineUrl" type="url" value="https://lin.ee/td2mRBRQ" placeholder="https://lin.ee/..." />
      </label>
      <label>
        Instagram URL
        <input id="instagramUrl" type="url" value="https://www.instagram.com/cocoro_salon.fuse?igsh=MTVmYmo2bmo4cGd6ag==" placeholder="https://www.instagram.com/..." />
      </label>
      <label>
        GoogleマップURL
        <input id="mapUrl" type="url" value="https://maps.app.goo.gl/k2i4qREAfF5n8n3dA?g_st=ic" placeholder="https://maps.app.goo.gl/..." />
      </label>
      <label>
        電話番号
        <input id="phone" type="tel" value="070-6552-9193" placeholder="070-0000-0000" />
      </label>

      <div class="button-row">
        <button type="button" id="downloadButton" class="primary">設定ファイルを作る</button>
        <button type="button" id="testButton">入力したリンクを確認</button>
        <a class="button" href="settings.html">設定画面に戻る</a>
      </div>
    </section>

    <p class="note">作成された <strong>site-config.js</strong> をホームページの同じフォルダに上書きすると、サイト内のリンクが変わります。</p>
  </main>

  <script src="site-config.js"></script>
  <script>
    const config = window.COCORO_SITE_CONFIG || {};
    const inputs = {
      lineUrl: document.getElementById("lineUrl"),
      instagramUrl: document.getElementById("instagramUrl"),
      mapUrl: document.getElementById("mapUrl"),
      phone: document.getElementById("phone")
    };

    Object.entries(inputs).forEach(([key, input]) => {
      if (config[key]) input.value = config[key];
    });

    const getConfig = () => ({
      lineUrl: inputs.lineUrl.value.trim(),
      instagramUrl: inputs.instagramUrl.value.trim(),
      mapUrl: inputs.mapUrl.value.trim(),
      phone: inputs.phone.value.trim()
    });

    document.getElementById("downloadButton").addEventListener("click", () => {
      const text = `// LINE・Instagram・Googleマップ・電話番号を変更する設定ファイルです。\nwindow.COCORO_SITE_CONFIG = ${JSON.stringify(getConfig(), null, 2)};\n`;
      const blob = new Blob([text], { type: "text/javascript" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = "site-config.js";
      link.click();
      URL.revokeObjectURL(url);
    });

    document.getElementById("testButton").addEventListener("click", () => {
      const next = getConfig();
      window.open(next.lineUrl, "_blank", "noopener");
    });
  </script>
</body>
</html>
